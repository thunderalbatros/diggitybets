<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntHub — Winner Celebration Overlay (1920x1080 Transparent)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=21.0">
  <script src="../data/curated_slots.js?v=21.0"></script>
  <script src="../site/js/slot-resolver.js?v=21.0"></script>
  <script src="../site/js/avatar-generator.js?v=21.0"></script>
</head>
<body class="obs-mode">
  <!-- Dynamic Fullscreen Particle Canvas for 3D Gold Coins Falling from the Sky (Background Layer) -->
  <canvas id="fx-canvas"></canvas>

  <!-- Audio Gate Prompt (Only shown in ?preview=1 mode if browser blocked autoplay) -->
  <div id="audio-gate-prompt" class="audio-gate hidden" style="display: none;">
    <div class="audio-gate-pill">
      <span class="gate-icon">🔊</span>
      <span>CLICK ANYWHERE TO UNMUTE AUDIO AND TRIGGER CELEBRATION</span>
      <button class="gate-btn" id="btn-unlock-audio">UNMUTE NOW</button>
    </div>
  </div>

  <!-- Floating Winner Stage (100% hidden & transparent when idle; activates in center of screen on win) -->
  <div id="winner-billboard" class="billboard-container tier-partial" aria-live="polite">
    <!-- Special Grand Win Effects: Rotating Golden Sunburst & Expanding Shockwave Rings -->
    <div class="grand-sunburst" id="grand-sunburst" aria-hidden="true"></div>
    <div class="grand-shockwave ring-1" aria-hidden="true"></div>
    <div class="grand-shockwave ring-2" aria-hidden="true"></div>
    <div class="billboard-glow-backdrop" aria-hidden="true"></div>

    <div class="billboard-card" id="billboard-card">
      <!-- Top Category & Event Badge -->
      <div class="billboard-top-pill" id="billboard-top-pill">
        <span class="top-pill-icon" id="billboard-icon">⚔️</span>
        <span class="billboard-category" id="billboard-category">1V1 ROUND WINNER</span>
      </div>

      <!-- Centerpiece: Winner Spectator Avatar + Crown + Glowing Ring -->
      <div class="winner-avatar-stage">
        <div class="winner-avatar-crown" id="winner-avatar-crown" aria-hidden="true">👑</div>
        <div class="winner-avatar-ring" id="winner-avatar-ring">
          <img id="winner-avatar-img" class="winner-avatar-img" src="" alt="Winner Avatar" />
        </div>
        <div class="winner-tier-ribbon" id="winner-tier-ribbon">ROUND VICTORY</div>
      </div>

      <!-- Centerpiece: Winner Spectator Username -->
      <div class="winner-title-wrapper">
        <h1 class="winner-username" id="winner-username">@Winner</h1>
        <div id="winner-announcement-banner" style="margin-top: 8px; padding: 7px 18px; border-radius: 999px; background: rgba(83, 252, 24, 0.14); border: 1.5px solid rgba(83, 252, 24, 0.65); color: #53fc18; font-family: 'Chakra Petch', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.6px; text-align: center; text-shadow: 0 0 12px rgba(83, 252, 24, 0.45);">
          Congratulations @Winner has been picked!
        </div>
      </div>

      <!-- Winning Slot & Score / Multiplier Info Pill -->
      <div class="winner-slot-pill" id="winner-slot-pill">
        <img id="winner-slot-img" class="slot-thumbnail" src="https://mediumrare.imgix.net/9ff267150fab30e5f0cff7f09456fa2e5e966015c7fe65969104f4c4c442a746?w=360&auto=format" alt="Winning Slot" onerror="this.onerror=null; this.src='https://mediumrare.imgix.net/9ff267150fab30e5f0cff7f09456fa2e5e966015c7fe65969104f4c4c442a746?w=360&auto=format';">
        <div class="slot-text-group">
          <span class="slot-label" id="winner-slot-label">WINNING SLOT</span>
          <span class="slot-name" id="winner-slot-name">Wanted Dead or a Wild</span>
        </div>
        <div class="stat-badge" id="winner-stat-badge">
          <span id="winner-stat-value">WIN 🏆</span>
        </div>
      </div>

      <!-- Prize / Advancement Banner -->
      <div class="prize-tag" id="winner-prize-tag">
        <span id="winner-prize-text">STREAK 1/4 · $5.00 USD BANKED</span>
      </div>
    </div>
  </div>

  <!-- Quick Streamer Test Controls (Only visible when ?preview=1 is passed) -->
  <div id="streamer-controls" class="test-controls-bar" style="display: none;">
    <span class="controls-label">⚡ LIVE DEMO CONTROLS:</span>
    <button class="test-btn battle" id="btn-test-partial">⚔️ Partial Win (Short)</button>
    <button class="test-btn tourney" id="btn-test-grand-cashout">💰 1v1 !cashout / $20 Max (Special)</button>
    <button class="test-btn tourney" id="btn-test-tourney">🏆 8-Bracket Champion (Special)</button>
    <button class="test-btn coins" id="btn-test-coins">🪙 Coin Rain</button>
    <button class="test-btn obs-toggle" id="btn-toggle-bg">🌓 Toggle Background</button>
  </div>

  <script src="main.js?v=21.0"></script>
</body>
</html>
