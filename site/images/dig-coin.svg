  <circle cx="16" cy="16" r="9.2" stroke="rgba(255,215,0,0.35)" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Embossed $D Identity Monogram -->
  <path d="M13.5 8.2V23.8M11.2 10H16.6C19.6 10 21.5 12.1 21.5 16C21.5 19.9 19.6 22 16.6 22H11.2V10Z" stroke="url(#digGlyph)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Kick Green Spark Accent -->
