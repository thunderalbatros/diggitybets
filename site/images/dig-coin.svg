<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="digGoldRim" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF08A"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="digCore" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#070A12"/>
    </radialGradient>
    <linearGradient id="digGlyph" x1="8" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFE55C"/>
