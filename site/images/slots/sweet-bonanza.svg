<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg-sweet-bonanza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0618"/>
      <stop offset="100%" stop-color="#12020b"/>
    </linearGradient>
    <linearGradient id="glow-sweet-bonanza" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4081" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="300" height="400" rx="16" fill="url(#bg-sweet-bonanza)" stroke="#ff4081" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Top Ambient Glow -->
  <circle cx="150" cy="80" r="120" fill="#ff4081" opacity="0.15"/>

  <!-- Provider Badge -->
  <rect x="20" y="20" width="130" height="24" rx="6" fill="#000000" fill-opacity="0.7" stroke="rgba(255,255,255,0.15)"/>
  <text x="85" y="36" fill="#ff4081" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">PRAGMATIC PLAY</text>

  <!-- Max Win Badge -->
  <rect x="160" y="20" width="120" height="24" rx="6" fill="#ffd700" fill-opacity="0.15" stroke="#ffd700" stroke-opacity="0.4"/>
  <text x="220" y="36" fill="#ffd700" font-family="'Chakra Petch', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">25,000x MAX WIN</text>

  <!-- Central Icon & Emblem -->
  <g transform="translate(150, 190)">
    <circle cx="0" cy="0" r="65" fill="#000000" fill-opacity="0.4" stroke="#ff4081" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="0" y="24" font-size="64" text-anchor="middle">🍭</text>
  </g>

  <!-- Lower Title Banner -->
  <rect x="15" y="305" width="270" height="75" rx="12" fill="#07090e" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)"/>
  <text x="150" y="338" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Sweet Bonanza 1000</text>
  <text x="150" y="362" fill="#ff4081" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">OFFICIAL VERIFIED SLOT</text>
</svg>