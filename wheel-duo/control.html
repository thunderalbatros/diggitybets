<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntHub — Duo-Wheel OBS Dock</title>
  <style>
    :root {
      --bg: #090c15;
      --card-bg: #121826;
      --cyan: #00e5ff;
      --gold: #ffd700;
      --green: #00e676;
      --text: #ffffff;
      --text-muted: #8e9bb0;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      font-size: 13px;
    }
    h1 {
      font-size: 15px;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .panel-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .mode-select {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      text-align: center;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }
    button.btn-spin {
      background: linear-gradient(135deg, #ffd700, #ffb300);
      color: #000;
      font-family: 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
      transition: transform 0.15s;
    }
    button.btn-spin:active {
      transform: scale(0.98);
    }
    .duo-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .duo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .duo-user {
      color: var(--cyan);
      font-weight: 600;
      width: 40%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .duo-slot {
      color: var(--gold);
      font-weight: 600;
      width: 50%;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .input-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      flex: 1;
    }
    .btn-add {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <h1>
    <span>DUO-WHEEL — OBS CONTROL</span>
    <span style="font-size: 11px; color: var(--green);">ONLINE</span>
  </h1>

  <div class="panel-grid">
    <!-- Selection Mode -->
    <div class="card">
      <div class="card-title">Selection Mode</div>
      <div class="mode-select">
        <div class="mode-btn active" id="btn-mode-battle" onclick="setMode('battle')">⚔️ 1v1 Battle</div>
        <div class="mode-btn" id="btn-mode-tourney" onclick="setMode('tourney')">🏆 8-Bracket Tourney</div>
      </div>
      <button class="btn-spin" id="btn-spin-trigger" onclick="triggerSpin()">🎰 SPIN WHEEL (SELECT)</button>
    </div>

    <!-- Queue of Participants + Slots -->
    <div class="card">
      <div class="card-title" style="display: flex; justify-content: space-between;">
        <span>Duo Queue (Chatters + Slots)</span>
        <span id="pool-count" style="color: var(--gold);">8 in queue</span>
      </div>
      <div class="duo-list" id="duo-list">
        <!-- Rendered dynamically -->
      </div>
      <div class="input-row">
        <input type="text" id="new-user" placeholder="Username (@Chatter)">
        <input type="text" id="new-slot" placeholder="Slot Name (e.g. Wanted Dead)">
        <button class="btn-add" onclick="addDuo()">+ Add</button>
      </div>
      <button onclick="loadDemoPool()" style="margin-top: 8px; background: #1e293b; color: #8e9bb0; border: 1px solid var(--border); padding: 6px; border-radius: 6px; width: 100%; cursor: pointer;">
        🎲 Restore 8 Demo Duos
      </button>
    </div>
  </div>

  <script>
    let bc = null;
    try {
      bc = new BroadcastChannel('hunthub_duo_wheel');
    } catch {}

    let currentMode = 'battle';
    let pool = [
      { chatter: 'LuckyStriker', slot: 'Wanted Dead or a Wild', provider: 'Hacksaw', icon: '🤠' },
      { chatter: 'VegasKing', slot: 'Gates of Olympus 1000', provider: 'Pragmatic', icon: '⚡' },
      { chatter: 'SlotQueen', slot: 'San Quentin xWays', provider: 'Nolimit City', icon: '🔒' },
      { chatter: 'SpinMaster', slot: 'Sugar Rush 1000', provider: 'Pragmatic', icon: '🍬' },
      { chatter: 'Strike777', slot: 'Rip City', provider: 'Hacksaw', icon: '🐱' },
      { chatter: 'BigBassBob', slot: 'Big Bass Splash', provider: 'Pragmatic', icon: '🎣' },
      { chatter: 'NeonWolf', slot: 'Chaos Crew 2', provider: 'Hacksaw', icon: '🐺' },
      { chatter: 'RoyalFlush', slot: 'Zeus vs Hades', provider: 'Pragmatic', icon: '⚔️' },
    ];

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-battle').classList.toggle('active', mode === 'battle');
      document.getElementById('btn-mode-tourney').classList.toggle('active', mode === 'tourney');

      // Sync mode immediately to wheel overlay
      if (bc) {
        bc.postMessage({ action: 'set_mode', mode: currentMode, ts: Date.now() });
      }
      try {
        localStorage.setItem('hunthub_duo_mode', currentMode);
      } catch {}
    }

    function triggerSpin() {
      const btn = document.getElementById('btn-spin-trigger');
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.textContent = '🎲 SPINNING WHEEL...';

      // 1. BroadcastChannel
      if (bc) {
        bc.postMessage({ action: 'spin', mode: currentMode, ts: Date.now() });
      }

      // 2. LocalStorage Cross-Window Fallback
      try {
        localStorage.setItem('hunthub_duo_spin_cmd', JSON.stringify({
          action: 'spin',
          mode: currentMode,
          ts: Date.now()
        }));
      } catch {}

      // 3. Local HTTP API if running
      fetch('http://127.0.0.1:3001/api/spin-duo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: currentMode }),
      }).catch(() => {});

      setTimeout(() => {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.textContent = '🎰 SPIN WHEEL (SELECT)';
      }, 5500);
    }

    function renderList() {
      const listEl = document.getElementById('duo-list');
      listEl.innerHTML = '';
      pool.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'duo-row';
        row.innerHTML = `
          <span class="duo-user">@${item.chatter}</span>
          <span class="duo-slot">${item.slot}</span>
        `;
        listEl.appendChild(row);
      });
      document.getElementById('pool-count').textContent = `${pool.length} in queue`;
    }

    function addDuo() {
      const u = document.getElementById('new-user').value.trim().replace(/^@/, '');
      const s = document.getElementById('new-slot').value.trim();
      if (!u || !s) return;
      pool.unshift({ chatter: u, slot: s, provider: 'Casino', icon: '🎰' });
      document.getElementById('new-user').value = '';
      document.getElementById('new-slot').value = '';
      renderList();
      if (bc) bc.postMessage({ action: 'set_pool', pool });
    }

    function loadDemoPool() {
      pool = [
        { chatter: 'LuckyStriker', slot: 'Wanted Dead or a Wild', provider: 'Hacksaw', icon: '🤠' },
        { chatter: 'VegasKing', slot: 'Gates of Olympus 1000', provider: 'Pragmatic', icon: '⚡' },
        { chatter: 'SlotQueen', slot: 'San Quentin xWays', provider: 'Nolimit City', icon: '🔒' },
        { chatter: 'SpinMaster', slot: 'Sugar Rush 1000', provider: 'Pragmatic', icon: '🍬' },
        { chatter: 'Strike777', slot: 'Rip City', provider: 'Hacksaw', icon: '🐱' },
        { chatter: 'BigBassBob', slot: 'Big Bass Splash', provider: 'Pragmatic', icon: '🎣' },
        { chatter: 'NeonWolf', slot: 'Chaos Crew 2', provider: 'Hacksaw', icon: '🐺' },
        { chatter: 'RoyalFlush', slot: 'Zeus vs Hades', provider: 'Pragmatic', icon: '⚔️' },
      ];
      renderList();
      if (bc) bc.postMessage({ action: 'set_pool', pool });
    }

    renderList();
  </script>
</body>
</html>
