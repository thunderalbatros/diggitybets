<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diggity Stake Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      background: #080b11;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 14px;
      border: 1px solid rgba(83, 252, 24, 0.35);
    }
    .hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hdr strong { color: #53fc18; font-size: 12px; letter-spacing: 0.6px; }
    .badge { font-size: 10px; background: rgba(255,215,0,0.14); color: #ffd700; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .field { margin-bottom: 9px; }
    .field label { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 700; }
    .field input {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    .btn-tier {
      border: none;
      border-radius: 6px;
      padding: 8px 4px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .btn-tier:active { transform: scale(0.96); }
    .t-3s { background: #53fc18; color: #000; }
    .t-4s { background: #38bdf8; color: #000; }
    .t-5s { background: #ffd700; color: #000; }
    .t-super { background: #ff2a5f; color: #fff; }
    #popup-status {
      margin-top: 10px;
      font-size: 11px;
      color: #38bdf8;
      text-align: center;
      min-height: 16px;
    }
    .hint {
      margin-top: 8px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hdr">
    <strong>⚡ DIGGITY AUTO-HUNT</strong>
    <span class="badge">v1.2 · ALL MIRRORS</span>
  </div>

  <div class="field">
    <label for="popup-slot">Detected Slot (Editable)</label>
    <input id="popup-slot" type="text" value="Wanted Dead or a Wild">
  </div>

  <div class="row">
    <div class="field">
      <label for="popup-bet">Bet Size ($)</label>
      <input id="popup-bet" type="number" step="0.20" min="0.10" value="2.00">
    </div>
    <div class="field">
      <label for="popup-caller">Caller (@User)</label>
      <input id="popup-caller" type="text" placeholder="@tarkansky">
    </div>
  </div>

  <div class="tiers">
    <button id="popup-btn-3s" class="btn-tier t-3s" type="button">+3S</button>
    <button id="popup-btn-4s" class="btn-tier t-4s" type="button">+4S</button>
    <button id="popup-btn-5s" class="btn-tier t-5s" type="button">+5S</button>
    <button id="popup-btn-super" class="btn-tier t-super" type="button">+SUPER</button>
  </div>

  <div id="popup-status">Ready — Works on stake.krd &amp; stake.com</div>
  <div class="hint">Hotkeys: <strong>Alt+B</strong> (+3S) · <strong>Alt+S</strong> (+SUPER)</div>

  <script src="popup.js"></script>
</body>
</html>
