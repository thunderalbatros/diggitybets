<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntHub — 8-Bracket Tournament Overlay</title>
  <link rel="stylesheet" href="style.css?v=19.0">
  <script src="../data/curated_slots.js?v=19.0"></script>
  <script src="../site/js/slot-resolver.js?v=19.0"></script>
  <script src="libs/confetti.browser.min.js"></script>
  <script src="libs/lucide.min.js"></script>
</head>
<body>
  <div id="stage-wrapper">
    <!-- Top Header (Minimalist Title Only) -->
    <header class="tourney-header">
      <div class="brand-group">
        <div class="trophy-badge">🏆</div>
        <div>
          <h1 class="tourney-title" id="tourney-title">8-BRACKET SLOT CHAMPIONSHIP</h1>
          <span class="tourney-subtitle">SINGLE ELIMINATION TOURNAMENT</span>
        </div>
      </div>
    </header>

    <!-- Tournament Bracket Stage with Mini Slot Cards -->
    <main class="tourney-arena">
      <div id="bracket-grid" class="native-bracket-grid">
        <!-- Col 1: Quarterfinals (m1..m4) -->
        <div class="bracket-column" id="col-quarters">
          <div class="column-header">QUARTERFINALS</div>
          <div class="bracket-cards-track" id="track-quarters">
            <div class="match-card" id="card-m1"></div>
            <div class="match-card" id="card-m2"></div>
            <div class="match-card" id="card-m3"></div>
            <div class="match-card" id="card-m4"></div>
          </div>
        </div>

        <!-- Connectors Col 1 -> Col 2 -->
        <div class="connectors-col" id="conn-col-1">
          <svg class="connector-svg" id="svg-conn-1" viewBox="0 0 80 800" preserveAspectRatio="none">
            <path class="connector-line" id="conn-m1-m5" d="M 0 100 H 40 V 200 H 80" />
            <path class="connector-line" id="conn-m2-m5" d="M 0 300 H 40 V 200 H 80" />
            <path class="connector-line" id="conn-m3-m6" d="M 0 500 H 40 V 600 H 80" />
            <path class="connector-line" id="conn-m4-m6" d="M 0 700 H 40 V 600 H 80" />
          </svg>
        </div>

        <!-- Col 2: Semifinals (m5, m6) -->
        <div class="bracket-column" id="col-semis">
          <div class="column-header">SEMIFINALS</div>
          <div class="bracket-cards-track" id="track-semis">
            <div class="match-card" id="card-m5"></div>
            <div class="match-card" id="card-m6"></div>
          </div>
        </div>

        <!-- Connectors Col 2 -> Col 3 -->
        <div class="connectors-col" id="conn-col-2">
          <svg class="connector-svg" id="svg-conn-2" viewBox="0 0 80 800" preserveAspectRatio="none">
            <path class="connector-line" id="conn-m5-m7" d="M 0 200 H 40 V 400 H 80" />
            <path class="connector-line" id="conn-m6-m7" d="M 0 600 H 40 V 400 H 80" />
          </svg>
        </div>

        <!-- Col 3: Grand Final (m7) -->
        <div class="bracket-column" id="col-final">
          <div class="column-header" style="color: var(--gold-accent);">GRAND FINAL 🏆</div>
          <div class="bracket-cards-track" id="track-final">
            <div class="match-card final-match" id="card-m7"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Fullscreen Casino Universe Champion Celebration Modal (Hidden unless explicitly triggered) -->
    <div class="champion-modal" id="champion-modal">
      <div class="modal-card">
        <div class="modal-chips-row">🏆 💰 👑 💰 🏆</div>
        <div class="champion-badge">TOURNAMENT CHAMPION</div>
        <h1 class="champion-name" id="champion-name">@StreamerWinner</h1>
        <div class="champion-slot" id="champion-slot">Winning Slot: Wanted Dead or a Wild</div>
      </div>
    </div>
  </div>

  <script src="main.js?v=19.0"></script>
</body>
</html>
