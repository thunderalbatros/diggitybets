<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diggity VIP Casino Reel — diggitybets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fixed 500x500 design canvas, auto-scaled to whatever size the browser source / window has -->
  <div id="stage" class="stage">
    <div id="flash" class="flash"></div>
    <div id="rays" class="rays"></div>
    <canvas id="fxCanvas" class="fx-canvas" width="500" height="500"></canvas>

    <!-- Diggity VIP vertical square reel -->
    <div id="ruleta" class="ruleta">
      <div class="reel-header">
        <span class="vip-badge">DIGGITY VIP</span>
        <span class="live-indicator">LIVE REEL</span>
      </div>
      <div class="degradado arr"></div>
      <div class="degradado aba"></div>
      <div class="marcador"></div>
      <div id="pista" class="pista"></div>
    </div>

    <!-- Synchronized Result Celebration Modal -->
    <div id="resultModal" class="result-modal oculto">
      <div class="result-glow"></div>
      <div class="result-pill">👑 VIP WINNER SELECTED</div>
      <div class="result-avatar-wrap">
        <img id="resultAvatar" class="result-avatar" src="" alt="Winner Avatar" />
        <div id="resultAvatarInitials" class="result-avatar-initials">?</div>
      </div>
      <div id="resultName" class="result-name">@Winner</div>
      <div id="resultClaimText" class="result-claim">Congratulations @Winner has been picked!</div>
    </div>
  </div>

  <!-- Shown only outside OBS (or with ?controls=1) so the live stream never shows buttons -->
  <div id="controls" class="controls oculto">
    <button id="btnPick" class="btn btn-gold" title="Pick a real winner among chatters of the last 90 seconds">🎰 SPIN VIP REEL</button>
    <button id="btnDemo" class="btn btn-ghost" title="Full test with fake names (no chat message)">🧪 DEMO</button>
  </div>
  <div id="estado" class="estado">Connecting to Streamer.bot…</div>

  <script src="config.js"></script>
  <script src="libs/streamerbot-client.js"></script>
  <script src="libs/confetti.browser.min.js"></script>
  <script src="libs/pro-fx-audio.js"></script>
  <script src="main.js"></script>
</body>
</html>
