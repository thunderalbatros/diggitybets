<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntHub — Bonus Hunt OBS Control Dock</title>
  <script src="../data/curated_slots.js"></script>
  <style>
    :root {
      --bg: #090c15;
      --card-bg: #121826;
      --cyan: #00e5ff;
      --gold: #ffd700;
      --green: #00e676;
      --text: #ffffff;
      --text-muted: #8e9bb0;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      font-size: 13px;
    }
    h1 {
      font-size: 15px;
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(0, 230, 118, 0.15);
      color: var(--green);
      border: 1px solid rgba(0, 230, 118, 0.3);
    }
    .panel-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      position: relative;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    .col { flex: 1; position: relative; }
    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    input:focus { outline: none; border-color: var(--gold); }
    button {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      width: 100%;
      transition: all 0.2s;
    }
    button:hover { background: #334155; border-color: rgba(255, 255, 255, 0.3); }
    .btn-gold { background: var(--gold); color: #000; border-color: var(--gold); }
    .btn-gold:hover { background: #ffea75; }
    .btn-cyan { background: var(--cyan); color: #000; border-color: var(--cyan); }
    .btn-cyan:hover { background: #5df2ff; }
    .btn-danger { background: rgba(255, 42, 95, 0.2); border-color: #ff2a5f; color: #ff6b8b; }

    /* Slot Card Picker Autocomplete Dropdown */
    .slot-picker-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #0f1626;
      border: 1px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85);
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      margin-top: 4px;
    }
    .slot-picker-dropdown.active {
      display: block;
    }
    .slot-picker-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.15s;
    }
    .slot-picker-item:hover {
      background: rgba(255, 215, 0, 0.15);
    }
    .slot-picker-img {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255, 215, 0, 0.3);
      flex-shrink: 0;
    }
    .slot-picker-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .slot-picker-name {
      font-weight: 700;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .slot-picker-prov {
      font-size: 10px;
      color: var(--gold);
      text-transform: uppercase;
    }

    /* Selected Badge */
    .selected-slot-preview {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--cyan);
      border-radius: 6px;
      padding: 4px 8px;
      margin-top: 6px;
      font-size: 11px;
    }
    .selected-slot-preview.active {
      display: flex;
    }
    .selected-slot-preview img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: cover;
    }

    /* Bonus Item in Dock List */
    .bonus-item {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bonus-item-img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(255, 215, 0, 0.3);
      flex-shrink: 0;
    }
    .bonus-item-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .bonus-item-title {
      font-weight: 700;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bonus-item-caller {
      font-size: 11px;
      color: var(--cyan);
      font-weight: 600;
    }
    .bonus-item-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bonus-item-inputs input {
      width: 75px;
      text-align: center;
      padding: 4px;
    }
    .bonus-item-inputs button {
      width: auto;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <h1>
    <span>COMMUNITY BONUS HUNT — OBS CONTROL</span>
    <span class="status-badge" id="dock-status">LOCAL ONLINE</span>
  </h1>

  <div class="panel-grid">
    <!-- Hunt Configuration -->
    <div class="card">
      <div class="card-title">Hunt Configuration</div>
      <div class="row">
        <div class="col">
          <label>Hunt Title</label>
          <input type="text" id="cfg-title" value="Community Bonus Hunt #12">
        </div>
        <div class="col">
          <label>Start Cost ($)</label>
          <input type="number" id="cfg-cost" value="500">
        </div>
      </div>
      <div class="row">
        <div class="col">
          <button class="btn-gold" id="btn-open-hunt">Start New Hunt</button>
        </div>
        <div class="col">
          <button class="btn-danger" id="btn-reset">Reset Hunt</button>
        </div>
      </div>
      <div class="row" style="margin-top: 6px;">
        <button id="btn-demo" style="background: #2563eb;">⚡ Load Demo Hunt (10 Bonuses)</button>
      </div>
    </div>

    <!-- Add Bonus with Card Picker Autocomplete -->
    <div class="card">
      <div class="card-title">Add Bonus (Chat Call)</div>
      <div class="row">
        <div class="col" style="flex: 2;">
          <input type="text" id="add-slot" placeholder="Search Slot (e.g. Cook Out, Wanted, Gates...)" autocomplete="off">
          <!-- Autocomplete Dropdown Grid -->
          <div class="slot-picker-dropdown" id="slot-picker-dropdown"></div>
        </div>
        <div class="col" style="flex: 1.5;">
          <input type="text" id="add-caller" placeholder="Caller (@Chatter)">
        </div>
        <div class="col" style="flex: 1;">
          <input type="number" id="add-bet" value="1.0" step="0.2" placeholder="Bet $">
        </div>
      </div>

      <!-- Selected Slot Visual Preview -->
      <div class="selected-slot-preview" id="selected-slot-preview">
        <img id="preview-img" src="" alt="">
        <span id="preview-text" style="font-weight: 700; color: #fff;"></span>
        <span id="preview-prov" style="color: var(--gold); margin-left: auto;"></span>
      </div>

      <button class="btn-cyan" id="btn-add-bonus" style="margin-top: 8px;">+ Add Bonus to Queue</button>
    </div>

    <!-- Collected Bonuses / Payout Entry -->
    <div class="card">
      <div class="card-title">
        <span>Collected Bonuses & Payouts</span>
        <span id="hunt-stats-quick" style="color: var(--gold);">0 / 0</span>
      </div>
      <div id="bonuses-dock-list" style="max-height: 280px; overflow-y: auto;">
        <!-- Dynamically rendered bonuses with mini card images -->
      </div>
      <button class="btn-gold" id="btn-finish-hunt" style="margin-top: 10px; padding: 10px;">
        🏆 FINISH HUNT & CROWN WINNER (!GUESS)
      </button>
    </div>
  </div>

  <script>
    const serverUrl = 'http://127.0.0.1:3001';
    let bc = null;
    try {
      bc = new BroadcastChannel('hunthub_bonushunt');
    } catch {}

    // Curated Slot Database (148 verified slots including all 59 Only on Stake exclusives)
    const PRELOADED_SLOTS = (window.HUNTHUB_CURATED_SLOTS && window.HUNTHUB_CURATED_SLOTS.length > 0)
      ? window.HUNTHUB_CURATED_SLOTS
      : [
          {
            name: 'Cook Out',
            provider: 'Only on Stake',
            image: 'https://mediumrare.imgix.net/67ccc373c89ba0c20791a337d304a8c50c78295c5e18987e59dd4975324119b0?w=180&h=236&fit=min&auto=format'
          },
          {
            name: 'Wanted Dead or a Wild',
            provider: 'Hacksaw Gaming',
            image: 'https://mediumrare.imgix.net/9ff267150fab30e5f0cff7f09456fa2e5e966015c7fe65969104f4c4c442a746?w=360&auto=format'
          },
          {
            name: 'Gates of Olympus 1000',
            provider: 'Pragmatic Play',
            image: 'https://mediumrare.imgix.net/fdf333e96a5e21555bbb4e9e04a3ee4e1986c9cca9aa75141597041cc8334d23?w=360&auto=format'
          }
        ];

    let selectedSlot = null;
    let localState = null;

    // Slot Search & Card Picker
    const addSlotInput = document.getElementById('add-slot');
    const slotPickerDropdown = document.getElementById('slot-picker-dropdown');
    const previewContainer = document.getElementById('selected-slot-preview');
    const previewImg = document.getElementById('preview-img');
    const previewText = document.getElementById('preview-text');
    const previewProv = document.getElementById('preview-prov');

    addSlotInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        slotPickerDropdown.classList.remove('active');
        return;
      }

      // Search across all 4,889 slots, prioritizing prefix matches & Tier 1/2 providers
      const matches = PRELOADED_SLOTS.filter(s => s.name.toLowerCase().includes(q));
      matches.sort((a, b) => {
        const aStart = a.name.toLowerCase().startsWith(q) ? 0 : 1;
        const bStart = b.name.toLowerCase().startsWith(q) ? 0 : 1;
        if (aStart !== bStart) return aStart - bStart;
        const aWeight = a.weight || 1;
        const bWeight = b.weight || 1;
        return bWeight - aWeight;
      });

      const topMatches = matches.slice(0, 40);
      slotPickerDropdown.innerHTML = '';

      if (topMatches.length > 0) {
        topMatches.forEach(slot => {
          const item = document.createElement('div');
          item.className = 'slot-picker-item';
          item.innerHTML = `
            <img class="slot-picker-img" src="${slot.image}" alt="${slot.name}" onerror="this.src='https://via.placeholder.com/34x34/1a233a/ffd700?text=SLOT';">
            <div class="slot-picker-info">
              <span class="slot-picker-name">${slot.name}</span>
              <span class="slot-picker-prov">${slot.provider} ${slot.tier === '1' ? '⭐' : ''}</span>
            </div>
          `;
          item.addEventListener('click', () => {
            selectSlot(slot);
          });
          slotPickerDropdown.appendChild(item);
        });
      }

      // Option to use custom slot
      const customItem = document.createElement('div');
      customItem.className = 'slot-picker-item';
      customItem.style.background = 'rgba(0, 229, 255, 0.08)';
      customItem.innerHTML = `
        <div style="width:34px; height:34px; border-radius:6px; background:#1e293b; display:flex; align-items:center; justify-content:center; font-size:16px;">🎰</div>
        <div class="slot-picker-info">
          <span class="slot-picker-name">+ Use "${e.target.value.trim()}"</span>
          <span class="slot-picker-prov">Custom Slot</span>
        </div>
      `;
      customItem.addEventListener('click', () => {
        selectSlot({
          name: e.target.value.trim(),
          provider: 'Casino Slot',
          image: 'https://via.placeholder.com/180x236/121826/ffd700?text=' + encodeURIComponent(e.target.value.trim().substring(0, 8))
        });
      });
      slotPickerDropdown.appendChild(customItem);

      slotPickerDropdown.classList.add('active');
    });

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      if (!addSlotInput.contains(e.target) && !slotPickerDropdown.contains(e.target)) {
        slotPickerDropdown.classList.remove('active');
      }
    });

    function selectSlot(slot) {
      selectedSlot = slot;
      addSlotInput.value = slot.name;
      slotPickerDropdown.classList.remove('active');

      previewImg.src = slot.image;
      previewText.textContent = slot.name;
      previewProv.textContent = slot.provider;
      previewContainer.classList.add('active');
    }

    function saveAndBroadcast(state) {
      localState = state;
      try {
        localStorage.setItem('hunthub_bonushunt_state', JSON.stringify(state));
      } catch {}
      if (bc) bc.postMessage({ state });
      updateUI(state);
    }

    async function apiPost(endpoint, data = {}) {
      try {
        const res = await fetch(`${serverUrl}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          const json = await res.json();
          if (json.state) {
            saveAndBroadcast(json.state);
            return json.state;
          }
        }
      } catch {}
      return null;
    }

    function calculateMetrics(state) {
      const bonuses = state.bonuses || [];
      const opened = bonuses.filter(b => b.status === 'OPENED');
      const remaining = bonuses.filter(b => b.status !== 'OPENED');
      const winnings = opened.reduce((acc, b) => acc + (b.payout || 0), 0);
      const startCost = Number(state.startCost || 0);

      const openedStake = opened.reduce((acc, b) => acc + (b.betSize || 1), 0);
      const remainingStake = remaining.reduce((acc, b) => acc + (b.betSize || 1), 0);

      const runAverageX = openedStake > 0 ? (winnings / openedStake) : 0;
      const neededDollars = Math.max(0, startCost - winnings);
      const reqAverageX = remainingStake > 0 ? (neededDollars / remainingStake) : 0;
      const reqAvgDollars = remaining.length > 0 ? (neededDollars / remaining.length) : 0;

      let bestWin = null;
      let luckyWin = null;
      opened.forEach(b => {
        if (!bestWin || b.payout > bestWin.payout) bestWin = b;
        if (!luckyWin || b.multiplier > luckyWin.multiplier) luckyWin = b;
      });

      let closestGuess = null;
      if (state.guesses && state.guesses.length > 0) {
        let minDiff = Infinity;
        state.guesses.forEach(g => {
          const diff = Math.abs(g.amount - winnings);
          if (diff < minDiff) {
            minDiff = diff;
            closestGuess = { username: g.username, guess: g.amount, diff };
          }
        });
      }

      return {
        startCost,
        totalBonuses: bonuses.length,
        openedBonuses: opened.length,
        remainingBonuses: remaining.length,
        winnings,
        endingBalance: winnings,
        profit: winnings - startCost,
        runAverageX,
        reqAverageX,
        reqAvgDollars,
        bestWin,
        luckyWin,
        closestGuess,
      };
    }

    function updateUI(state) {
      if (!state) return;
      const m = state.metrics || calculateMetrics(state);
      document.getElementById('hunt-stats-quick').textContent = `${m.openedBonuses} / ${m.totalBonuses}`;

      const listEl = document.getElementById('bonuses-dock-list');
      listEl.innerHTML = '';

      (state.bonuses || []).forEach((b) => {
        const item = document.createElement('div');
        item.className = 'bonus-item';

        const imgSrc = b.slotImage || 'https://via.placeholder.com/40x40/121826/ffd700?text=SLOT';

        item.innerHTML = `
          <img class="bonus-item-img" src="${imgSrc}" alt="${b.slotName}" onerror="this.src='https://via.placeholder.com/40x40/121826/ffd700?text=SLOT';">
          <div class="bonus-item-main">
            <span class="bonus-item-title">${b.slotName}</span>
            <span class="bonus-item-caller">@${b.callerUsername || 'Streamer'} · $${Number(b.betSize || 1).toFixed(2)}</span>
          </div>
          <div class="bonus-item-inputs">
            <input type="number" step="0.5" id="payout-${b.id}" value="${b.payout || ''}" placeholder="Payout $" ${b.status === 'OPENED' ? 'style="border-color: var(--green); color: var(--green);"' : ''}>
            <button class="btn-gold" onclick="recordPayout('${b.id}')">💾</button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // Handlers
    document.getElementById('btn-open-hunt').addEventListener('click', async () => {
      const title = document.getElementById('cfg-title').value;
      const cost = parseFloat(document.getElementById('cfg-cost').value) || 500;

      const newState = {
        id: 'hunt_' + Date.now(),
        title,
        startCost: cost,
        status: 'COLLECTING',
        bonuses: [],
        guesses: [],
        metrics: {
          startCost: cost,
          totalBonuses: 0,
          openedBonuses: 0,
          remainingBonuses: 0,
          winnings: 0,
          endingBalance: 0,
          profit: -cost,
          runAverageX: 0,
          reqAverageX: 0,
          reqAvgDollars: 0,
          bestWin: null,
          luckyWin: null,
          closestGuess: null,
        },
      };

      const res = await apiPost('/api/hunt/start', { title, startCost: cost });
      if (!res) saveAndBroadcast(newState);
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to reset the current bonus hunt?')) return;
      const res = await apiPost('/api/hunt/reset');
      if (!res) {
        document.getElementById('btn-open-hunt').click();
      }
    });

    document.getElementById('btn-add-bonus').addEventListener('click', async () => {
      const slotName = addSlotInput.value.trim();
      const caller = document.getElementById('add-caller').value.trim().replace(/^@/, '') || 'Streamer';
      const bet = parseFloat(document.getElementById('add-bet').value) || 1.0;

      if (!slotName) {
        alert('Please enter or select a slot name');
        return;
      }

      const slotImg = selectedSlot && selectedSlot.name.toLowerCase() === slotName.toLowerCase()
        ? selectedSlot.image
        : (PRELOADED_SLOTS.find(s => s.name.toLowerCase() === slotName.toLowerCase())?.image || 'https://via.placeholder.com/180x236/121826/ffd700?text=' + encodeURIComponent(slotName.substring(0, 8)));

      const slotProv = selectedSlot ? selectedSlot.provider : 'Casino';

      const bonusData = {
        slotName,
        slotProvider: slotProv,
        slotImage: slotImg,
        callerUsername: caller,
        betSize: bet,
      };

      const res = await apiPost('/api/hunt/add-bonus', bonusData);
      if (!res && localState) {
        const newBonus = {
          id: 'b_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          slotName,
          slotProvider: slotProv,
          slotImage: slotImg,
          callerUsername: caller,
          callerKickId: 1000 + Math.floor(Math.random() * 9000),
          betSize: bet,
          payout: 0,
          multiplier: 0,
          status: 'PENDING',
        };
        localState.bonuses.push(newBonus);
        localState.metrics = calculateMetrics(localState);
        saveAndBroadcast(localState);
      }

      addSlotInput.value = '';
      selectedSlot = null;
      previewContainer.classList.remove('active');
    });

    window.recordPayout = async function(bonusId) {
      const val = parseFloat(document.getElementById(`payout-${bonusId}`).value);
      if (isNaN(val)) return;

      const res = await apiPost('/api/hunt/payout', { bonusId, payout: val });
      if (!res && localState) {
        const b = localState.bonuses.find(item => item.id === bonusId);
        if (b) {
          b.payout = val;
          b.multiplier = b.betSize > 0 ? (val / b.betSize) : 0;
          b.status = 'OPENED';
          localState.status = 'OPENING';
          localState.metrics = calculateMetrics(localState);
          saveAndBroadcast(localState);
        }
      }
    };

    document.getElementById('btn-finish-hunt').addEventListener('click', async () => {
      const res = await apiPost('/api/hunt/finish');
      if (!res && localState) {
        localState.status = 'FINISHED';
        localState.metrics = calculateMetrics(localState);
        saveAndBroadcast(localState);
      }
    });

    document.getElementById('btn-demo').addEventListener('click', () => {
      const demoBonuses = [
        {
          id: 'd1',
          slotName: 'Wanted Dead or a Wild',
          slotProvider: 'Hacksaw Gaming',
          slotImage: 'https://mediumrare.imgix.net/8165d8a4c8c5559b280bbee4e757f7fdd512f329128c23d60c6c66e533fd976b?w=180&h=236&fit=min&auto=format',
          callerUsername: 'LuckyStriker',
          betSize: 1.0,
          payout: 245.5,
          multiplier: 245.5,
          status: 'OPENED'
        },
        {
          id: 'd2',
          slotName: 'Gates of Olympus 1000',
          slotProvider: 'Pragmatic Play',
          slotImage: 'https://mediumrare.imgix.net/09b89e85fd9d787d15b0fc1e8ae13693a5e8b83e600030e53cfb640c815d8ea1?w=180&h=236&fit=min&auto=format',
          callerUsername: 'VegasKing',
          betSize: 1.0,
          payout: 38.0,
          multiplier: 38.0,
          status: 'OPENED'
        },
        {
          id: 'd3',
          slotName: 'San Quentin xWays',
          slotProvider: 'Nolimit City',
          slotImage: 'https://mediumrare.imgix.net/7bee41634019f0eb07ba2b55388e79e3a0e0861047450b34d7075602f70520bf?w=180&h=236&fit=min&auto=format',
          callerUsername: 'SlotQueen',
          betSize: 0.4,
          payout: 120.0,
          multiplier: 300.0,
          status: 'OPENED'
        },
        {
          id: 'd4',
